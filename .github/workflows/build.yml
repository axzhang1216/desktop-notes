name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.9.0'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.9.0-Windows
          path: |
            dist/DesktopNotes-v1.9.0-Windows.zip
            dist/DesktopNotes-v1.9.0-SHA256.txt
          retention-days: 14

      - name: Publish v1.9.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.9.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.9.0-Windows.zip `
              .\dist\DesktopNotes-v1.9.0-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.9.0：新增 Obsidian 便签页、常用问答、Linear issue 复制和顶部贴边收起。

          - 新增「便签」页：文字、#标签和粘贴/拖入的图片直接保存到 Obsidian 的便签文件夹，Ctrl+Enter 发送。
          - 从 MiniAgent 对话记录聚合常用问题，点击即可查看已有回答；点击最近标签查看对应便签。
          - Linear issue 旁新增复制按钮，一次复制编号、链接、标题和正文。
          - 窗口拖到屏幕顶部即可停靠，鼠标悬停边条自动滑出，离开后快速收起；动画支持中途反向，展开不抢键盘焦点。
          - 修复标题栏拖动、最大化后无法还原，以及多屏收起时跨屏跳动；上下屏接缝不触发停靠。
          - 每日总结生成前从昨天零点补归档聊天记录，补入此前未被 watcher 发现的会话。

          下载 DesktopNotes-v1.9.0-Windows.zip，解压后运行 DesktopNotes.exe。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.9.0-Windows.zip `
            .\dist\DesktopNotes-v1.9.0-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.9.0 · 便签、常用问答与贴边收起' `
            --notes $notes
