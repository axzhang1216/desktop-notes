name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.9.2'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.9.2-Windows
          path: |
            dist/DesktopNotes-v1.9.2-Windows.zip
            dist/DesktopNotes-v1.9.2-SHA256.txt
          retention-days: 14

      - name: Publish v1.9.2 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.9.2'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.9.2-Windows.zip `
              .\dist\DesktopNotes-v1.9.2-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.9.2：设置里可以检查更新，一键升级到新版本。

          - 设置页底部新增「检查更新」，读取 GitHub Releases 最新版本。
          - 有新版本时下载 Windows 压缩包，校验后替换当前程序并自动重启；便签数据和配置保存在本机，不受影响。
          - 已是新版时显示当前版本；下载或替换失败会保留当前程序并显示原因。
          - Linear 读取遇到系统代理失效时自动直连重试，失败时会显示具体网络原因。

          下载 DesktopNotes-v1.9.2-Windows.zip，解压后运行 DesktopNotes.exe。之后可以直接在设置里更新。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.9.2-Windows.zip `
            .\dist\DesktopNotes-v1.9.2-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.9.2 · 设置内一键更新' `
            --notes $notes
