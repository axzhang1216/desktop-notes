name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.9.1'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.9.1-Windows
          path: |
            dist/DesktopNotes-v1.9.1-Windows.zip
            dist/DesktopNotes-v1.9.1-SHA256.txt
          retention-days: 14

      - name: Publish v1.9.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.9.1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.9.1-Windows.zip `
              .\dist\DesktopNotes-v1.9.1-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.9.1：常用问答和最近便签支持再次点击收起。

          - 常用问答点击展开回答，再点同一条收起；点击另一条切换内容。
          - 新增最近 6 条便签的标题列表，包括没有标签的便签，点击展开正文，再点收起。
          - 最近标签也支持再次点击收起，清空或保存便签后可正常重新展开。
          - 补充展开、收起、内容切换及无标签便签的 UI 回归检查。

          下载 DesktopNotes-v1.9.1-Windows.zip，解压后运行 DesktopNotes.exe。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.9.1-Windows.zip `
            .\dist\DesktopNotes-v1.9.1-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.9.1 · 问答与最近便签点击收起' `
            --notes $notes
