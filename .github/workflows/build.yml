name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.8.0'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.8.0-Windows
          path: |
            dist/DesktopNotes-v1.8.0-Windows.zip
            dist/DesktopNotes-v1.8.0-SHA256.txt
          retention-days: 14

      - name: Publish v1.8.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.8.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.8.0-Windows.zip `
              .\dist\DesktopNotes-v1.8.0-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.8.0 的第一页换成「问笔记」：直接和你的 Obsidian 笔记对话，回答带文件路径和行号。

          - 首页由本地便签改为聊天界面：Enter 发送，Shift+Enter 换行，右上角可以开新对话。
          - 回答只做检索：先在 Obsidian 库里用 rg/read 找依据，每条结论带「相对路径:行号」，找不到就直说没有找到。
          - 每次对话保存为一个 markdown，放在 Obsidian 的 MiniAgent 文件夹里，带标题、时间、模型和完整问答。
          - 后端用本机 Pi（minimax/MiniMax-M3.1-Flash），不建知识图谱也不做向量索引，笔记改了立刻生效。
          - 每日总结与潜在问题不再依赖一直开着 Apocalypse：需要时便签自己补归档并重算，约 50 秒。
          - 工具栏去掉 Linear 与总结页的刷新按钮，点开即刷新。

          下载 DesktopNotes-v1.8.0-Windows.zip，解压后运行 DesktopNotes.exe。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.8.0-Windows.zip `
            .\dist\DesktopNotes-v1.8.0-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.8.0 · 问笔记' `
            --notes $notes
