name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.3.0'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.3.0-Windows
          path: |
            dist/DesktopNotes-v1.3.0-Windows.zip
            dist/DesktopNotes-v1.3.0-SHA256.txt
          retention-days: 14

      - name: Publish v1.3.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.3.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.3.0-Windows.zip `
              .\dist\DesktopNotes-v1.3.0-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.3.0 将 Linear 视图改为未完成待办。

          - 顶部便签与 Linear 图标在本地便签和待办之间切换。
          - 进入待办时，左上角标题改为「待办」；回到便签时恢复为「便签」。
          - 只显示仍有未完成 Issue 的 Project 标题，不显示项目描述。
          - 每个 Project 下列出未完成 Issue；没有 Project 的 Issue 归入「无项目」。
          - 已完成、已取消的 Issue，以及没有未完成 Issue 的 Project，不显示。
          - Linear Personal API Key 仍使用 Windows DPAPI（CurrentUser）加密保存在本机。
          - Linear 集成仍为只读，不改变 notes.json 数据结构与备份格式。

          下载 DesktopNotes-v1.3.0-Windows.zip，解压后运行 DesktopNotes.exe。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.3.0-Windows.zip `
            .\dist\DesktopNotes-v1.3.0-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.3.0 · Linear 待办' `
            --notes $notes
