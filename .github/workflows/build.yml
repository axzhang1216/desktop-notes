name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.5.0'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.5.0-Windows
          path: |
            dist/DesktopNotes-v1.5.0-Windows.zip
            dist/DesktopNotes-v1.5.0-SHA256.txt
          retention-days: 14

      - name: Publish v1.5.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.5.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.5.0-Windows.zip `
              .\dist\DesktopNotes-v1.5.0-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.5.0 新增每日总结与潜在问题两个页面，可以直接让 Apocalypse 重新生成。

          - 工具栏新增「总结」和「潜在问题」两个页面，读取 Apocalypse 的每日总结。
          - 「总结」按今日、昨日列出每个项目的需求与进展；「潜在问题」列出还没做完的事。
          - 打开页面或点刷新时，如果总结缺失或超过一小时没更新，便签直接调用 Apocalypse 重新生成，Apocalypse 后台没启动也能用。
          - 右键刷新按钮可以强制重新生成。

          下载 DesktopNotes-v1.5.0-Windows.zip，解压后运行 DesktopNotes.exe。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.5.0-Windows.zip `
            .\dist\DesktopNotes-v1.5.0-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.5.0 · 每日总结与潜在问题' `
            --notes $notes
