name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify data contracts
        shell: pwsh
        run: .\build.ps1 -Test -StoreOnly

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = '1.7.0'
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist 'package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item .\bin\DesktopNotes.exe (Join-Path $stage 'DesktopNotes.exe')
          Copy-Item .\README.md (Join-Path $stage 'README.md')
          Copy-Item .\LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item .\docs\linear.md (Join-Path $stage 'LINEAR.md')

          $zip = Join-Path $dist "DesktopNotes-v$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  DesktopNotes-v$version-Windows.zip" | Set-Content -Encoding ascii (Join-Path $dist "DesktopNotes-v$version-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopNotes-v1.7.0-Windows
          path: |
            dist/DesktopNotes-v1.7.0-Windows.zip
            dist/DesktopNotes-v1.7.0-SHA256.txt
          retention-days: 14

      - name: Publish v1.7.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.7.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              .\dist\DesktopNotes-v1.7.0-Windows.zip `
              .\dist\DesktopNotes-v1.7.0-SHA256.txt `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag assets refreshed."
            exit 0
          }

          $notes = @"
          桌面便签 v1.7.0 增加了从 Orca 读取的「工作中」页面，并在智能体跑完时震动提醒。

          - 「工作中」只读读取 Orca 的智能体看板：会话标题、最近一条消息、工作区和进行时间。
          - 跑完但还没点开过的会话会保留，标着已完成、等待你或需要你。
          - 点一下卡片，Orca 会切到该会话所在的终端；看过哪些会话会记住。
          - 智能体从工作中变为完成、等待或受阻时，便签窗口会左右震动提醒。
          - 顶部日期改为不显示年份，完整日期放在悬停提示中，给新增的工具栏按钮留出位置。

          下载 DesktopNotes-v1.7.0-Windows.zip，解压后运行 DesktopNotes.exe。
          "@

          gh release create $tag `
            .\dist\DesktopNotes-v1.7.0-Windows.zip `
            .\dist\DesktopNotes-v1.7.0-SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'v1.7.0 · 工作中的智能体' `
            --notes $notes
